    <title>Meine Bildergalerie</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: #f2f0ed;
            font-family: Georgia, "Times New Roman", serif;
            color: #333;
        }

        /* Überschrift */
        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        header p {
            margin-top: 10px;
            color: #777;
            font-family: sans-serif;
            font-size: 15px;
        }

        /* Galerie */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 22px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-link {
            display: block;
            text-decoration: none;
            color: inherit;
            background: white;
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .gallery-link:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
        }

        .gallery-item {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            border-radius: 4px;
        }

        .caption {
            text-align: center;
            padding: 12px 5px 6px;
            font-size: 16px;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.90);
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .lightbox:target {
            display: flex;
        }

        .lightbox img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        .close {
            position: fixed;
            top: 20px;
            right: 30px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 40px;
            text-decoration: none;
            line-height: 1;
        }

        .close:hover {
            color: #ddd;
        }

        /* Mobil */
        @media (max-width: 600px) {
            body {
                padding: 25px 12px;
            }

            header h1 {
                font-size: 30px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .gallery-item {
                height: 280px;
            }
        }
    </style>
</head>
