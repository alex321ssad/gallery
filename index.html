<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilder-Galerie</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    h1 {
      text-align: center;
      font-weight: 300;
      letter-spacing: 0.15em;
      margin-bottom: 2.5rem;
      font-size: 1.8rem;
      color: #e0e0e0;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      cursor: pointer;
      aspect-ratio: 1 / 1;
      background: #1a1a1a;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .gallery-item:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.08);
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .lightbox.active {
      opacity: 1;
      visibility: visible;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      transform: scale(0.92);
      transition: transform 0.35s ease;
    }

    .lightbox.active img {
      transform: scale(1);
    }

    .lightbox-close {
      position: absolute;
      top: 1.5rem;
      right: 1.8rem;
      font-size: 2.4rem;
      color: #fff;
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.2s;
      line-height: 1;
    }

    .lightbox-close:hover {
      opacity: 1;
    }

    .hint {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>MEINE GALERIE</h1>

  <div class="gallery">
    <div class="gallery-item"><img src="bild1.jpg"  alt="Bild 1"  loading="lazy"></div>
    <div class="gallery-item"><img src="bild2.jpg"  alt="Bild 2"  loading="lazy"></div>
    <div class="gallery-item"><img src="bild3.jpg"  alt="Bild 3"  loading="lazy"></div>
    <div class="gallery-item"><img src="bild4.jpg"  alt="Bild 4"  loading="lazy"></div>
    <div class="gallery-item"><img src="bild5.png"  alt="Bild 5"  loading="lazy"></div>
    <div class="gallery-item"><img src="bild6.png"  alt="Bild 6"  loading="lazy"></div>
    <div class="gallery-item"><img src="bild7.png"  alt="Bild 7"  loading="lazy"></div>
    <div class="gallery-item"><img src="bild8.jpg"  alt="Bild 8"  loading="lazy"></div>
    <div class="gallery-item"><img src="bild9.jpg"  alt="Bild 9"  loading="lazy"></div>
    <div class="gallery-item"><img src="bild10.jpg" alt="Bild 10" loading="lazy"></div>
    <div class="gallery-item"><img src="bild11.jpg" alt="Bild 11" loading="lazy"></div>
    <div class="gallery-item"><img src="bild12.jpg" alt="Bild 12" loading="lazy"></div>
    <div class="gallery-item"><img src="bild13.jpg" alt="Bild 13" loading="lazy"></div>
    <div class="gallery-item"><img src="bild14.jpg" alt="Bild 14" loading="lazy"></div>
    <div class="gallery-item"><img src="bild15.jpg" alt="Bild 15" loading="lazy"></div>
    <div class="gallery-item"><img src="bild16.jpg" alt="Bild 16" loading="lazy"></div>
    <div class="gallery-item"><img src="bild17.jpg" alt="Bild 17" loading="lazy"></div>
    <div class="gallery-item"><img src="bild18.jpg" alt="Bild 18" loading="lazy"></div>
    <div class="gallery-item"><img src="bild19.jpg" alt="Bild 19" loading="lazy"></div>
    <div class="gallery-item"><img src="bild20.jpg" alt="Bild 20" loading="lazy"></div>
  </div>

  <p class="hint">Klick auf ein Bild, um es größer anzusehen</p>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="closeBtn" aria-label="Schließen">&times;</button>
    <img src="" alt="Großansicht" id="lightboxImg">
  </div>

  <script>
    const galleryItems = document.querySelectorAll('.gallery-item');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const closeBtn = document.getElementById('closeBtn');

    galleryItems.forEach(item => {
      item.addEventListener('click', () => {
        const img = item.querySelector('img');
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightbox.classList.add('active');
      });
    });

    closeBtn.addEventListener('click', () => lightbox.classList.remove('active'));
    
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) lightbox.classList.remove('active');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') lightbox.classList.remove('active');
    });
  </script>
</body>
</html>
